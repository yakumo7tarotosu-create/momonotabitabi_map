<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅々マップ</title>
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅々マップ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap&text=%E6%97%85%E3%80%85%E3%83%9E%E3%83%83%E3%83%97">
<style>
/* 地図を全面に敷き、上に検索カード・下にシートを重ねる片手操作のレイアウト */
:root{
  --bg:#F3F1F5; --surface:#FFFFFF; --sunk:#F1EEF3; --ink:#1F2A44; --muted:#676C7E; --line:#E2DEE7;
  --accent:#D9567A; --accent-ink:#FFFFFF;
  --trend:#E0552F; --sign:#C98E00; --classic:#1D8577; --none:#868B9C; --danger:#C7343A;
  --shadow:0 6px 22px rgba(31,42,68,.16);
  --f-title:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121626; --surface:#1C2135; --sunk:#252B44; --ink:#ECEEF6; --muted:#A3A8BB; --line:#30375A;
    --accent:#F0849F; --accent-ink:#1A1020; --trend:#F07A55; --sign:#E8B53A; --classic:#45B8A6; --none:#9CA1B3; --danger:#F06A6F;
    --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#map{position:fixed;inset:0;background:var(--sunk)}
.maplibregl-map{font-family:var(--f-body)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:env(safe-area-inset-bottom,0px)}

/* 上部：検索カード */
.top{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.card{pointer-events:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-family:var(--f-title);font-size:18px;margin:0;letter-spacing:.04em}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brand .sp{flex:1}
.iconbtn{border:0;background:var(--sunk);border-radius:10px;min-width:40px;height:36px;padding:0 10px;font-size:14px}
.searchrow{display:flex;gap:6px;align-items:stretch}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.searchrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:16px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.primary:disabled{opacity:.55}

/* 右下ボタン */
.fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:1000;display:grid;gap:10px}
.fab{border:0;width:52px;height:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:12px;font-weight:600;display:grid;place-items:center;line-height:1.1}

/* 配置モードの帯 */
.banner{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:1050;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
.banner span{flex:1}
.banner button{border:0;border-radius:9px;padding:7px 12px;background:var(--surface);color:var(--ink);font-weight:600}

/* 下からのシート */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.28);z-index:1090}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:78%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
.sheet-head h2{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:14px;-webkit-overflow-scrolling:touch}

.field{display:grid;gap:5px}
.field > label,.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px}
.danger.solid{background:var(--danger);color:#fff}
.note{font-size:12px;color:var(--muted)}
.saved{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0}

.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item .dot{margin-top:6px}
.item .main{min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .addr{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{font-size:11px;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--ink);color:var(--surface)}
.badge.warn{background:transparent;border:1px solid var(--sign);color:var(--sign)}
.empty{padding:18px 4px;color:var(--muted);font-size:14px}
.swipe-hint{margin:0}
.row{position:relative;overflow:hidden}
.row .item{position:relative;z-index:1;background:var(--surface);touch-action:pan-y;-webkit-user-select:none;user-select:none;padding-inline:4px}
.row-bg{position:absolute;inset:0 0 1px 0;display:flex;align-items:center;justify-content:flex-start;padding:0 18px;color:#fff;font-weight:700;font-size:14px;opacity:0}
.row-bg.left{justify-content:flex-end}
.pinmark{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px}
.row-confirm{display:grid;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}

.menu{display:grid;gap:8px}
.menu button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.menu b{font-size:15px}
.menu small{color:var(--muted);font-size:12px}

pre.fmt{background:var(--sunk);border-radius:10px;padding:10px;font-size:12px;overflow-x:auto;margin:0;white-space:pre}
.progress{font-size:13px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 120px);z-index:1200;background:var(--ink);color:var(--surface);border-radius:12px;padding:9px 14px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ピン */
.pin-wrap{background:none;border:0;width:26px;height:32px;cursor:pointer}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin i{width:8px;height:8px;border-radius:50%;background:#fff;display:block}
.pin.done{background:#fff;border:3px solid var(--c)}
.pin.done i{background:var(--c)}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px}
.me{width:16px;height:16px;border-radius:50%;background:#2F7BEA;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,234,.25)}
</style>
</head>
<body>
<div id="map" role="application" aria-label="地図"></div>

<div class="top">
  <div class="card">
    <div class="brand">
      <h1>旅々マップ</h1>
      <span class="count" id="count"></span>
      <span class="sp"></span>
      <button class="iconbtn" id="menuBtn" aria-label="メニュー">メニュー</button>
    </div>
    <form class="searchrow" id="searchForm" autocomplete="off">
      <div class="seg" role="group" aria-label="検索の種類">
        <button type="button" id="modeAddr" aria-pressed="true">住所</button>
        <button type="button" id="modeName" aria-pressed="false">店名</button>
      </div>
      <input id="q" type="search" placeholder="住所を入力" enterkeyhint="search" aria-label="検索語">
      <button class="primary" id="searchBtn" type="submit">追加</button>
    </form>
  </div>
</div>

<div class="fabs">
  <button class="fab" id="locBtn" aria-label="現在地">現在地</button>
  <button class="fab" id="listBtn" aria-label="一覧">一覧</button>
</div>

<div class="banner" id="banner" hidden>
  <span id="bannerText"></span>
  <button id="bannerBtn">やめる</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="iconbtn" id="sheetClose">閉じる</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function(){
'use strict';

/* ---------- データ ---------- */
var KEY='tabitabi-map-v1', PREF='tabitabi-map-pref';
var LABELS={trend:{t:'流行',c:'var(--trend)'},sign:{t:'兆し',c:'var(--sign)'},classic:{t:'定番',c:'var(--classic)'},none:{t:'なし',c:'var(--none)'}};
var LABEL_ORDER=['trend','sign','classic','none'];
var STATUS={want:'行きたい',done:'行った'};

function load(){try{var s=localStorage.getItem(KEY);var a=s?JSON.parse(s):[];return Array.isArray(a)?a:[]}catch(e){return[]}}
function loadPref(){try{return JSON.parse(localStorage.getItem(PREF)||'{}')||{}}catch(e){return{}}}
function savePref(){try{localStorage.setItem(PREF,JSON.stringify(pref))}catch(e){}}
var pins=load(), pref=loadPref();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(pins));return true}catch(e){toast('保存できませんでした。ブラウザの保存設定を確認してください');return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byId(id){for(var i=0;i<pins.length;i++)if(pins[i].id===id)return pins[i];return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hasPos(p){return typeof p.lat==='number'&&typeof p.lng==='number'&&isFinite(p.lat)&&isFinite(p.lng)}
function labelFromText(t){t=String(t||'').trim();if(/流行/.test(t))return'trend';if(/兆/.test(t))return'sign';if(/定番/.test(t))return'classic';return'none'}
function newPin(o){return{id:uid(),name:o.name||'',address:o.address||'',label:o.label||'none',status:o.status||'want',quiet:o.quiet||'',memo:o.memo||'',lat:typeof o.lat==='number'?o.lat:null,lng:typeof o.lng==='number'?o.lng:null,check:!!o.check,pinned:!!o.pinned,pinnedAt:+o.pinnedAt||0,doneAt:+o.doneAt||0,created:Date.now()}}

/* ---------- 地図 ---------- */
var STYLES={
  color:{t:'カラー',url:'https://tiles.openfreemap.org/styles/liberty'},
  simple:{t:'シンプル',url:'https://tiles.openfreemap.org/styles/positron'},
  gsi:{t:'地理院（淡色）',url:{version:8,sources:{gsi:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],tileSize:256,maxzoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'}},layers:[{id:'gsi',type:'raster',source:'gsi'}]}}
};
var curStyle=STYLES[pref.style]?pref.style:'color';
var gl=new maplibregl.Map({container:'map',style:STYLES[curStyle].url,center:[135.5023,34.6937],zoom:12,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false,maxPitch:0});
gl.touchZoomRotate.disableRotation();
/* 店・施設アイコン、山の記号、番地を消し、地名は日本語で表示する（駅は残す） */
var HIDE_LAYERS=['poi','mountain_peak','aerodrome_label','housenumber'];
var JA_NAME=['coalesce',['get','name:ja'],['get','name']];
function tidyStyle(){
  var st;try{st=gl.getStyle()}catch(e){return}
  if(!st||!st.layers)return;
  st.layers.forEach(function(ly){
    if(ly.type!=='symbol')return;
    var sl=ly['source-layer']||'';
    try{
      if(HIDE_LAYERS.indexOf(sl)>=0&&!/transit|rail|station/i.test(ly.id)){gl.setLayoutProperty(ly.id,'visibility','none');return}
      var tf=ly.layout&&ly.layout['text-field'];
      if(tf&&/name/.test(JSON.stringify(tf)))gl.setLayoutProperty(ly.id,'text-field',JA_NAME);
    }catch(e){}
  });
}
gl.on('style.load',tidyStyle);
var mapErrShown=false;
gl.on('error',function(){if(mapErrShown)return;mapErrShown=true;toast('地図の一部を読み込めませんでした。通信状態を確認してください')});
function setTile(k){if(k===curStyle||!STYLES[k])return;curStyle=k;pref.style=k;savePref();gl.setStyle(STYLES[k].url)}
/* 以前の書き方（[緯度,経度]）のまま使えるようにする薄い窓口 */
var map={
  setView:function(ll,z){gl.jumpTo({center:[ll[1],ll[0]],zoom:z})},
  getZoom:function(){return gl.getZoom()},
  fitBounds:function(pts,o){var b=new maplibregl.LngLatBounds();pts.forEach(function(q){b.extend([q[1],q[0]])});gl.fitBounds(b,{padding:60,maxZoom:(o&&o.maxZoom)||16,duration:0})},
  getContainer:function(){return gl.getCanvasContainer()},
  on:function(ev,fn){gl.on(ev,function(e){if(e.lngLat)e.latlng={lat:e.lngLat.lat,lng:e.lngLat.lng};fn(e)})}
};

var markers={}, selected=null;
var filter={label:'all',status:'all'};
function passes(p){return(filter.label==='all'||p.label===filter.label)&&(filter.status==='all'||p.status===filter.status)}
function pinEl(p){
  var l=LABELS[p.label]||LABELS.none,w=document.createElement('div');
  w.className='pin-wrap';w.title=p.name||p.address||'名前なし';w.setAttribute('role','button');w.setAttribute('aria-label',w.title);
  w.innerHTML='<div class="pin'+(p.status==='done'?' done':'')+(selected===p.id?' sel':'')+'" style="--c:'+l.c+'"><i></i></div>';
  return w;
}
function renderMarkers(){
  Object.keys(markers).forEach(function(id){markers[id].remove()});
  markers={};
  pins.forEach(function(p){
    if(!hasPos(p)||!passes(p)||p.status==='done')return;
    var el=pinEl(p);
    var m=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(gl);
    el.addEventListener('click',function(ev){ev.stopPropagation();if(placing||moving)return;openEdit(p.id)});
    m.on('dragend',function(){var ll=m.getLngLat();var q=byId(p.id);if(q){q.lat=ll.lat;q.lng=ll.lng;q.check=false;persist()}});
    markers[p.id]=m;
  });
  updateCount();
}
function updateCount(){var n=pins.length,u=pins.filter(function(p){return!hasPos(p)}).length;document.getElementById('count').textContent=n+'件'+(u?'（未配置'+u+'）':'')}
function fitAll(){var pts=pins.filter(function(p){return hasPos(p)&&p.status!=='done'}).map(function(p){return[p.lat,p.lng]});if(pts.length===1)map.setView(pts[0],15);else if(pts.length>1)map.fitBounds(pts,{padding:[40,40],maxZoom:16})}

/* ---------- 検索 ---------- */
var lastNomi=0;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function nominatim(q){
  var wait=Math.max(0,lastNomi+1100-Date.now());
  return sleep(wait).then(function(){
    lastNomi=Date.now();
    var url='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=jp&accept-language=ja&addressdetails=0&limit=8&q='+encodeURIComponent(q);
    return fetch(url,{headers:{'Accept':'application/json'}});
  }).then(function(r){if(!r.ok)throw new Error('nominatim '+r.status);return r.json()})
  .then(function(a){return(Array.isArray(a)?a:[]).map(function(r){return{lat:parseFloat(r.lat),lng:parseFloat(r.lon),name:r.name||'',address:cleanAddr(r.display_name,r.name),kind:r.type||''}}).filter(function(r){return isFinite(r.lat)&&isFinite(r.lng)})});
}
function cleanAddr(d,name){
  if(!d)return'';
  var parts=String(d).split(',').map(function(s){return s.trim()}).filter(function(s){return s&&s!=='日本'&&!/^\d{3}-?\d{4}$/.test(s)});
  if(name&&parts[0]===name)parts.shift();
  return parts.reverse().join('');
}
function gsi(q){
  return fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q))
  .then(function(r){if(!r.ok)throw new Error('gsi '+r.status);return r.json()})
  .then(function(a){return(Array.isArray(a)?a:[]).map(function(f){var c=f&&f.geometry&&f.geometry.coordinates;return c?{lat:+c[1],lng:+c[0],name:'',address:(f.properties&&f.properties.title)||q}:null}).filter(function(r){return r&&isFinite(r.lat)&&isFinite(r.lng)})});
}
function searchAddress(q){
  return gsi(q).then(function(r){if(r.length)return r;return nominatim(q)},function(){return nominatim(q)});
}
function searchName(q){return nominatim(q)}

var mode=pref.mode==='name'?'name':'addr';
var qIn=document.getElementById('q'), sBtn=document.getElementById('searchBtn');
function setMode(m){mode=m;pref.mode=m;savePref();document.getElementById('modeAddr').setAttribute('aria-pressed',m==='addr');document.getElementById('modeName').setAttribute('aria-pressed',m==='name');qIn.placeholder=m==='addr'?'住所を入力':'店名を入力（例：店名 心斎橋）'}
setMode(mode);
document.getElementById('modeAddr').onclick=function(){setMode('addr')};
document.getElementById('modeName').onclick=function(){setMode('name')};

document.getElementById('searchForm').addEventListener('submit',function(e){
  e.preventDefault();var q=qIn.value.trim();if(!q)return;qIn.blur();
  sBtn.disabled=true;sBtn.textContent='検索中';
  var m=mode;
  (m==='addr'?searchAddress(q):searchName(q)).then(function(res){
    if(!res.length){showNotFound(q,m);return}
    if(m==='addr'||res.length===1){addFromResult(res[0],q,m);return}
    showResults(res,q);
  }).catch(function(){toast('検索できませんでした。通信状態を確認してください')})
  .then(function(){sBtn.disabled=false;sBtn.textContent='追加'});
});

function addFromResult(r,q,m){
  var p=newPin({name:m==='name'?(r.name||q):'',address:m==='addr'?(r.address||q):(r.address||''),lat:r.lat,lng:r.lng});
  pins.push(p);persist();qIn.value='';
  renderMarkers();map.setView([p.lat,p.lng],16);openEdit(p.id,true);
}

/* ---------- シート ---------- */

/* ---------- 一覧 ---------- */
function listOrder(a,b){
  var da=a.status==='done'?1:0,db=b.status==='done'?1:0;
  if(da!==db)return da-db;
  if(da&&db)return(b.doneAt||0)-(a.doneAt||0)||b.created-a.created;
  var pa=a.pinned?1:0,pb=b.pinned?1:0;
  if(pa!==pb)return pb-pa;
  if(pa&&pb)return(b.pinnedAt||0)-(a.pinnedAt||0);
  return(hasPos(a)?1:0)-(hasPos(b)?1:0)||b.created-a.created;
}

/* ---------- 一覧のスライド操作 ---------- */
function attachSwipe(row){
  var id=row.dataset.row, item=row.querySelector('.item'), bg=row.querySelector('.row-bg'), lab=bg.querySelector('.lab');
  var sx=0,sy=0,dx=0,dir=null,pid=null,swiped=false,stage=null;
  function limits(){var w=item.offsetWidth||320;return{t1:64,t2:Math.max(150,w*0.5),tl:-64}}
  function paint(){
    var p=byId(id);if(!p)return;var L=limits();
    bg.classList.toggle('left',dx<0);
    if(dx>0){
      if(dx>=L.t2){stage='done';bg.style.background='var(--classic)';lab.textContent=p.status==='done'?'行きたいに戻す':'行った'}
      else{stage=dx>=L.t1?'pin':null;bg.style.background='var(--accent)';lab.textContent=p.pinned?'固定を外す':'ピン留め'}
    }else if(dx<0){stage=dx<=L.tl?'del':null;bg.style.background='var(--danger)';lab.textContent='削除'}
    else{stage=null;lab.textContent=''}
    bg.style.opacity=stage?1:.55;
  }
  function settle(){item.style.transition='transform .18s ease';item.style.transform='translateX(0)';setTimeout(function(){bg.style.opacity=0},180)}
  item.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    sx=e.clientX;sy=e.clientY;dx=0;dir=null;pid=e.pointerId;swiped=false;stage=null;item.style.transition='none';
  });
  item.addEventListener('pointermove',function(e){
    if(e.pointerId!==pid)return;
    var x=e.clientX-sx,y=e.clientY-sy;
    if(!dir){
      if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.2){dir='h';try{item.setPointerCapture(pid)}catch(err){}}
      else if(Math.abs(y)>10){pid=null;return}
      else return;
    }
    dx=x;item.style.transform='translateX('+dx+'px)';paint();
  });
  function end(e){
    if(e.pointerId!==pid)return;pid=null;
    if(dir!=='h')return;
    swiped=true;var s=stage;settle();
    if(s==='pin')swipePin(id);
    else if(s==='done')swipeDone(id);
    else if(s==='del')askDelete(row,id);
  }
  item.addEventListener('pointerup',end);
  item.addEventListener('pointercancel',function(e){if(e.pointerId===pid){pid=null;if(dir==='h')settle()}});
  item.addEventListener('click',function(e){
    if(swiped){e.preventDefault();swiped=false;return}
    var p=byId(id);if(!p)return;if(hasPos(p)&&p.status!=='done')map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));openEdit(id);
  });
}
function swipePin(id){
  var p=byId(id);if(!p)return;
  p.pinned=!p.pinned;p.pinnedAt=p.pinned?Date.now():0;persist();
  setTimeout(function(){openList(true);toast(p.pinned?'ピン留めしました':'固定を外しました')},190);
}
function swipeDone(id){
  var p=byId(id);if(!p)return;
  p.status=p.status==='done'?'want':'done';p.doneAt=p.status==='done'?Date.now():0;persist();renderMarkers();
  setTimeout(function(){openList(true);toast(p.status==='done'?'「行った」にしました。地図から外し、一覧の最後に移しました':'「行きたい」に戻しました。地図に戻しました')},190);
}
function askDelete(row,id){
  var p=byId(id);if(!p)return;
  setTimeout(function(){
    row.innerHTML='<div class="row-confirm"><span>「'+esc(p.name||'名前なし')+'」を削除しますか？</span><span class="inline"><button type="button" class="danger solid" data-yes>削除する</button><button type="button" class="ghost" data-no>やめる</button></span></div>';
    row.querySelector('[data-yes]').onclick=function(){pins=pins.filter(function(x){return x.id!==id});persist();renderMarkers();openList(true);toast('削除しました')};
    row.querySelector('[data-no]').onclick=function(){openList(true)};
  },190);
}

/* ---------- まとめて取り込み ---------- */
function parseLines(text){
  var out=[];
  String(text||'').split(/\r?\n/).forEach(function(line){
    var s=line.trim();if(!s||/^#/.test(s))return;
    s=s.replace(/^[-・*]\s*/,'');
    var f=s.split(/\s*[｜|\t]\s*/);
    var name=(f[0]||'').trim(),addr=(f[1]||'').trim();
    if(!name&&!addr)return;
    out.push({name:name,address:addr,label:labelFromText(f[2]),quiet:(f[3]||'').trim(),memo:f.slice(4).join(' / ').trim()});
  });
  return out;
}
function dupe(r){return pins.some(function(p){return p.name===r.name&&p.address===r.address})}
function openImport(){
  var h='<p class="note">1行に1店ずつ貼り付けてください。区切りは「｜」です。住所がある行は住所で、ない行は店名で位置を探します。</p>'+
  '<pre class="fmt">店名｜住所｜ラベル｜空いている時間帯｜メモ\n例）〇〇珈琲｜大阪府大阪市北区〇〇1-2-3｜兆し｜平日の朝｜テラス席あり</pre>'+
  '<div class="field"><label for="impText">取り込む内容</label><textarea id="impText" style="min-height:150px" placeholder="ここに貼り付け"></textarea></div>'+
  '<div class="inline"><button class="primary" id="impGo">取り込む</button><span class="progress" id="impProg"></span></div>'+
  '<p class="note">店名だけで探すと1件あたり約1秒かかります。見つからなかったお店は「未配置」として一覧に入るので、あとで地図に置けます。</p>';
  openSheet('まとめて取り込み',h);
  document.getElementById('impGo').onclick=function(){
    var rows=parseLines(document.getElementById('impText').value);
    if(!rows.length){toast('取り込める行がありません');return}
    var btn=this,prog=document.getElementById('impProg');btn.disabled=true;
    var added=0,unplaced=0,skipped=0,check=0,i=0;
    function next(){
      if(i>=rows.length){
        persist();renderMarkers();fitAll();btn.disabled=false;
        prog.textContent='';
        openSheet('取り込み完了','<p>'+added+'件を追加しました。</p>'+
          (check?'<p class="note">店名から置いた '+check+'件 は「位置要確認」です。</p>':'')+
          (unplaced?'<p class="note">位置が見つからなかった '+unplaced+'件 は一覧に「未配置」で入っています。</p>':'')+
          (skipped?'<p class="note">同じ店名・住所がすでにある '+skipped+'件 は飛ばしました。</p>':'')+
          '<div class="inline"><button class="primary" id="impList">一覧を見る</button></div>');
        document.getElementById('impList').onclick=openList;
        return;
      }
      var r=rows[i++];prog.textContent=i+' / '+rows.length;
      if(dupe(r)){skipped++;return next()}
      var job=r.address?searchAddress(r.address):searchName(r.name.replace(/[／\/]/g,' '));
      job.then(function(res){
        var p=newPin(r);
        if(res.length){p.lat=res[0].lat;p.lng=res[0].lng;if(!r.address){p.check=true;check++;if(res[0].address)p.address=res[0].address}}
        else unplaced++;
        pins.push(p);added++;persist();
      },function(){pins.push(newPin(r));added++;unplaced++;persist()}).then(next);
    }
    next();
  };
}

/* ---------- 書き出し・読み込み ---------- */
function exportJson(){
  var d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  var blob=new Blob([JSON.stringify({app:'tabitabi-map',version:1,exported:d.toISOString(),pins:pins},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tabitabi-map-'+ymd+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
var fileIn=document.getElementById('fileIn');
fileIn.onchange=function(){
  var f=fileIn.files&&fileIn.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result),arr=Array.isArray(j)?j:j.pins;if(!Array.isArray(arr))throw 0;
      var n=0;arr.forEach(function(o){if(!o||typeof o!=='object')return;var p=newPin(o);if(o.id)p.id=String(o.id);if(o.created)p.created=+o.created||p.created;
        var ex=pins.findIndex(function(x){return x.id===p.id});if(ex>=0)pins[ex]=p;else pins.push(p);n++});
      persist();renderMarkers();fitAll();closeSheet();toast(n+'件を読み込みました');
    }catch(e){toast('このファイルは読み込めません。書き出したJSONファイルを選んでください')}
    fileIn.value='';
  };
  rd.readAsText(f);
};

  document.getElementById('mImp').onclick=openImport;
  document.getElementById('mList').onclick=openList;
  document.getElementById('mExp').onclick=exportJson;
  document.getElementById('mImpF').onclick=function(){fileIn.click()};
  sBody.querySelectorAll('[data-tile]').forEach(function(b){b.onclick=function(){setTile(b.dataset.tile);sBody.querySelectorAll('[data-tile]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
}
document.getElementById('menuBtn').onclick=openMenu;

/* ---------- 現在地 ---------- */
var meMarker=null;
document.getElementById('locBtn').onclick=function(){
  if(!navigator.geolocation){toast('この端末では現在地を使えません');return}
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll=[pos.coords.latitude,pos.coords.longitude];
    if(meMarker)meMarker.remove();
    var me=document.createElement('div');me.className='me';
    meMarker=new maplibregl.Marker({element:me}).setLngLat([ll[1],ll[0]]).addTo(gl);
    map.setView(ll,16);
  },function(){toast('現在地を取得できませんでした。位置情報の許可を確認してください')},{enableHighAccuracy:true,timeout:10000});
};

/* ---------- 通知 ---------- */
var toastT=null;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600)}

/* ---------- 起動 ---------- */
renderMarkers();fitAll();
window.__tabitabi={parseLines:parseLines,cleanAddr:cleanAddr,labelFromText:labelFromText};
})();
</script>
